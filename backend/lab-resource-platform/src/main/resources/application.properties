
spring.application.name=lab-resource-platform
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/labdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway migration baseline
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

app.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}
app.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.oauth.google.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.oauth.google.ticket-seconds=${GOOGLE_OAUTH_TICKET_SECONDS:60}
app.mail.enabled=${MAIL_ENABLED:false}

# Single-process API throttling defaults; tune through environment in deployment.
app.rate-limit.api.max-requests=${API_RATE_LIMIT_MAX_REQUESTS:300}
app.rate-limit.api.window-seconds=${API_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.login.max-requests=${LOGIN_RATE_LIMIT_MAX_REQUESTS:10}
app.rate-limit.login.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.registration.max-requests=${REGISTRATION_RATE_LIMIT_MAX_REQUESTS:10}
app.rate-limit.registration.window-seconds=${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.password-reset.max-requests=${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS:5}
app.rate-limit.password-reset.window-seconds=${PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:300}

# Elasticsearch search integration (disabled by default in Milestone 1)
elasticsearch.enabled=${ELASTICSEARCH_ENABLED:false}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

logging.level.org.springframework.security=INFO
logging.level.com.labresource.platform.auth.filter=INFO
