
spring.application.name=lab-resource-platform
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/labdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

app.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}

logging.level.org.springframework.security=INFO
logging.level.com.labresource.platform.auth.filter=INFO